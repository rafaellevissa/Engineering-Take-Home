services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    restart: unless-stopped

volumes:
  sqlite_data:
